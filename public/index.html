<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kokona-Radio</title>
<link rel="icon" type="image/png" href="/favicon-v1.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kokona-Radio">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #07070a;
    color: #ededf2;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .bg {
    position: fixed;
    inset: -8%;
    z-index: 0;
    background-position: center;
    background-size: cover;

    filter: brightness(0.55) saturate(1.35);
    transform: scale(1.08);
    background-color: #07070a;

    opacity: 1;
    transition: opacity 1.2s ease;
  }

  .bg.prev {
    z-index: -1;
    opacity: 0;
  }

  .shade {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse 120% 80% at 50% 42%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.62) 100%),
      linear-gradient(180deg, rgba(6,6,9,0.45) 0%, rgba(6,6,9,0.25) 45%, rgba(6,6,9,0.6) 100%);
    pointer-events: none;
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage {
    position: relative;
    z-index: 3;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 3.2vh, 38px) clamp(24px, 3.6vw, 60px);
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.42);
    font-weight: 500;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.72);
  }
  .live i {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ff453a;
    box-shadow: 0 0 10px rgba(255,69,58,0.85);
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.28; }
  }

  .main {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: clamp(36px, 5vw, 84px);
    align-items: center;
    align-content: center;
    min-height: 0;
    padding: clamp(18px, 3.5vh, 48px) 0;
  }

  .art {
    aspect-ratio: 1 / 1;
    height: min(60vh, 38vw);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    background: rgba(255,255,255,0.02);
    box-shadow:
      0 40px 90px -28px rgba(0,0,0,0.85),
      0 6px 20px -6px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.06);
  }
  .art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.9s ease;
    user-select: none;
    -webkit-user-drag: none;
  }
  .art img.on { opacity: 1; }

  .info {
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2vh, 22px);
    min-width: 0;
  }

  .title {
    font-size: clamp(26px, 3.2vw, 48px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.12;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 2px 24px rgba(0,0,0,0.4);
  }
  .artist {
    font-size: clamp(12px, 1.05vw, 15px);
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.48);
    margin-top: -6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lyrics {
    position: relative;
    height: min(32vh, 300px);
    overflow: hidden;
    margin-top: 6px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
  }
  .lyrics-inner {
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .ln {
    font-size: clamp(13px, 1.1vw, 16px);
    line-height: 1.95;
    color: rgba(255,255,255,0.26);
    transition: color 0.4s ease;
    padding: 1px 0;
    letter-spacing: 0.01em;
  }
  .ln.on { color: rgba(255,255,255,0.96); }
  .ln.blank { color: rgba(255,255,255,0.16); }

  .bottom {
    display: flex;
    align-items: center;
    gap: clamp(14px, 1.6vw, 24px);
    padding-top: clamp(14px, 2vh, 22px);
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .time {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.42);
    font-variant-numeric: tabular-nums;
    min-width: 42px;
  }
  .time.r { text-align: right; }

  .track {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.12);
    position: relative;
    margin: 4px 0;
  }
  .track .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 100%;

    transform: scaleX(0);
    transform-origin: 0 50%;
    background: rgba(255,255,255,0.85);
    will-change: transform;
  }
  .track .dot {
    position: absolute;
    top: 50%;
    left: 0;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.6);
    transform: translate(-50%, -50%);
  }

  .gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #07070a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    padding: 40px;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  .gate.gone {
    opacity: 0;
    visibility: hidden;
  }
  #enter {
    background: transparent;
    border: 0;
    color: rgba(255,255,255,0.72);
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.55em;
    text-transform: uppercase;
    padding: 22px 6px 22px 20px;
    position: relative;
    cursor: pointer;
    transition: color 0.35s ease;
  }
  #enter:disabled {
    color: rgba(255,255,255,0.32);
    cursor: default;
  }
  #enter::before,
  #enter::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.16);
    transition: background 0.4s ease;
  }
  #enter:disabled::before,
  #enter:disabled::after {
    background: rgba(255,255,255,0.08);
  }
  #enter::before { top: 0; }
  #enter::after  { bottom: 0; }
  #enter:hover:not(:disabled) { color: #fff; }
  #enter:hover:not(:disabled)::before,
  #enter:hover:not(:disabled)::after { background: rgba(255,255,255,0.72); }

  .notice {
    max-width: min(520px, 78vw);
    padding: 18px 26px;
    font-size: 13px;
    line-height: 1.75;
    color: rgba(255,255,255,0.58);
    text-align: center;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    word-wrap: break-word;
    display: none;
  }
  .notice.show { display: block; }
  .notice b, .notice strong {
    color: rgba(255,255,255,0.88);
    font-weight: 600;
  }
  .notice i {
    color: rgba(255,255,255,0.7);
    font-style: italic;
  }

  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    .stage { padding: 20px 22px; }
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      gap: 26px;
      align-items: center;
      align-content: center;
      padding: 12px 0;
    }
    .art {
      height: auto;
      width: min(62vw, 34vh);
      max-width: 280px;
      margin: 0 auto;
    }
    .info { gap: 12px; }
    .title { font-size: clamp(22px, 6vw, 32px); }
    .lyrics { height: 22vh; min-height: 120px; }
  }

  @media (min-width: 861px) and (min-aspect-ratio: 1/1) {
    .art {
      margin-left: clamp(16px, 2.6vw, 56px);
    }
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="shade"></div>
<div class="grain"></div>

<main class="stage">
  <header class="top">
    <span class="live"><i></i>On Air</span>
    <span><span id="listeners">0</span> 位听众 &nbsp;·&nbsp; <span id="clock">--:--</span></span>
  </header>

  <section class="main">
    <div class="art">
      <img id="cover" alt="">
    </div>
    <div class="info">
      <div class="title" id="title">正在连接</div>
      <div class="artist" id="artist"></div>
      <div class="lyrics" id="lyrics">
        <div class="lyrics-inner" id="lyricsInner"></div>
      </div>
    </div>
  </section>

  <footer class="bottom">
    <span class="time" id="elapsed">0:00</span>
    <div class="track">
      <div class="fill" id="fill"></div>
      <div class="dot" id="dot"></div>
    </div>
    <span class="time r" id="duration">0:00</span>
  </footer>
</main>

<div class="gate" id="gate">
  <button id="enter" disabled>加载中</button>
  <div class="notice" id="notice"></div>
</div>

<script src="/hls.min.js"></script>
<script>
(function () {
  'use strict';

  fetch('/index.json', { cache: 'no-store' }).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (j) {
    if (!j) return;
    if (j.title) document.title = j.title;
    if (j.themeColor) {
      var m = document.querySelector('meta[name="theme-color"]');
      if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
      m.content = j.themeColor;
    }
    var l = document.querySelector('link[rel="manifest"]');
    if (!l) { l = document.createElement('link'); l.rel = 'manifest'; document.head.appendChild(l); }
    l.href = '/manifest.json';
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  }).catch(function () {});

  var SID = (function () {
    try {
      var k = 'radio_sid';
      var v = localStorage.getItem(k);
      if (!v || !/^[A-Za-z0-9_-]{8,64}$/.test(v)) {
        v = Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem(k, v);
      }
      return v;
    } catch (e) {
      return 'r' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
  })();

  var $ = function (id) { return document.getElementById(id); };

  var bg          = $('bg');
  var cover       = $('cover');
  var titleEl     = $('title');
  var artistEl    = $('artist');
  var lyricsBox   = $('lyrics');
  var lyricsInner = $('lyricsInner');
  var fillEl      = $('fill');
  var dotEl       = $('dot');
  var elapsedEl   = $('elapsed');
  var durationEl  = $('duration');
  var listenersEl = $('listeners');
  var clockEl     = $('clock');
  var gate        = $('gate');
  var enterBtn    = $('enter');
  var noticeEl    = $('notice');

  var currentId = null;
  var currentDuration = 0;
  var baseElapsed = 0;
  var baseAt = 0;

  var SYNC_COUNT = null;

  var audioEl = null;

  var originPdt = 0;
  var fragPdt = 0;
  var fragStart = 0;
  var lastPdtElapsed = 0;

  function onFragChanged(frag) {
    if (!frag || !frag.programDateTime) return;
    fragPdt = frag.programDateTime;
    fragStart = (typeof frag.start === 'number') ? frag.start : 0;
  }

  function elapsedFromFrag() {
    if (!originPdt || !fragPdt || !audioEl) return null;
    var cur = audioEl.currentTime;
    if (!isFinite(cur)) return null;
    var e = (fragPdt + (cur - fragStart) * 1000 - originPdt) / 1000;
    if (!isFinite(e)) return null;
    if (e < -20) return null;
    if (currentDuration > 0 && e > currentDuration + 60) return null;
    lastPdtElapsed = e;
    return e;
  }
  var lyrics = [];
  var activeLine = -1;
  var started = false;
  var hlsInstance = null;
  var lastNotice = null;

  function showNotice(html) {
    if (html === lastNotice) return;
    lastNotice = html;
    if (!html) {
      noticeEl.classList.remove('show');
      noticeEl.innerHTML = '';
      return;
    }
    noticeEl.innerHTML = html;
    noticeEl.classList.add('show');
  }

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function parseLRC(text) {
  if (!text) return [];
  var out = [];
  var tagSource = '\\[(\\d{1,3}):(\\d{1,2})(?:[.:](\\d{1,3}))?\\]';
  var lines = text.split(/\r?\n/);
  var offsetRe = /^\s*\[offset:\s*([+-]?\d+)\s*\]\s*$/i;
  var fullTag = new RegExp(tagSource, 'g');
  var offsetMs = 0;

  function toSec(mm, ss, fr) {
    var frac = fr ? parseInt((fr + '00').slice(0, 3), 10) / 1000 : 0;
    return parseInt(mm, 10) * 60 + parseInt(ss, 10) + frac;
  }

  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i];

    var om = offsetRe.exec(raw);
    if (om) {
      offsetMs = parseInt(om[1], 10) || 0;
      continue;
    }

    var tags = [];
    var m;
    fullTag.lastIndex = 0;
    while ((m = fullTag.exec(raw)) !== null) {
      tags.push({ start: m.index, end: m.index + m[0].length, t: toSec(m[1], m[2], m[3]) });
    }
    if (!tags.length) continue;

    var leaderEnd = 0;
    for (var a = 0; a < tags.length; a++) {
      if (tags[a].start === leaderEnd) leaderEnd = tags[a].end;
      else break;
    }
    var allLeading = leadersAllLeading(tags, leaderEnd);

    var content = raw.replace(fullTag, '').replace(/\s+/g, ' ').trim();
    if (!content) continue;

    if (allLeading) {
      for (var k = 0; k < tags.length; k++) out.push({ t: tags[k].t, text: content });
    } else {
      out.push({ t: tags[0].t, text: content });
    }
  }

  if (offsetMs) {
    for (var j = 0; j < out.length; j++) out[j].t = Math.max(0, out[j].t - offsetMs / 1000);
  }
  return out.sort(function (x, y) { return x.t - y.t; });
  }

  function leadersAllLeading(tags, leaderEnd) {
  return leaderEnd === tags[tags.length - 1].end;
  }

  function renderLyrics() {
    lyricsInner.innerHTML = '';
    lyricsInner.style.transform = 'translateY(0)';
    activeLine = -1;
    lyricsOffsets = [];
    if (!lyrics.length) {
      var d = document.createElement('div');
      d.className = 'ln blank';
      d.textContent = '暂无歌词';
      lyricsInner.appendChild(d);
      return;
    }
    for (var i = 0; i < lyrics.length; i++) {
      var el = document.createElement('div');
      el.className = 'ln';
      el.textContent = lyrics[i].text;
      lyricsInner.appendChild(el);
    }

    cacheLyricOffsets();
  }

  function updateLyric(elapsed) {
    if (!lyrics.length) return;
    var idx = -1;
    for (var i = 0; i < lyrics.length; i++) {
      if (lyrics[i].t <= elapsed) idx = i; else break;
    }
    if (idx === activeLine) return;
    activeLine = idx;
    var kids = lyricsInner.children;
    for (var j = 0; j < kids.length; j++) {
      if (j === idx) kids[j].classList.add('on');
      else kids[j].classList.remove('on');
    }

    if (idx >= 0 && kids[idx]) {
      if (lyricsOffsets.length !== kids.length) cacheLyricOffsets();
      var y = lyricsOffsets[idx] - lyricsHalfHeight;
      lyricsInner.style.transform = 'translateY(' + (-y) + 'px)';
    } else {
      lyricsInner.style.transform = 'translateY(0)';
    }
  }

  var lyricsOffsets = [];
  var lyricsHalfHeight = 0;
  function cacheLyricOffsets() {
    var kids = lyricsInner.children;
    lyricsOffsets = new Array(kids.length);
    for (var i = 0; i < kids.length; i++) {
      lyricsOffsets[i] = kids[i].offsetTop + kids[i].offsetHeight / 2;
    }
    lyricsHalfHeight = lyricsBox.clientHeight / 2;
  }

  var lastShownElapsed = -1;
  var lastPctAt = 0;
  var lastShownP = -1;

  function updateProgress(elapsed, force) {
    var sec = Math.floor(elapsed);

    if (force || sec !== lastShownElapsed) {
      lastShownElapsed = sec;
      elapsedEl.textContent = fmt(sec);
      durationEl.textContent = fmt(currentDuration);
    }

    var nowMs = (window.performance && performance.now) ? performance.now() : Date.now();
    if (force || nowMs - lastPctAt >= 100) {
      lastPctAt = nowMs;
      var p = currentDuration > 0 ? Math.min(1, elapsed / currentDuration) : 0;
      if (Math.abs(p - lastShownP) > 0.0005) {
        lastShownP = p;
        fillEl.style.transform = 'scaleX(' + p.toFixed(4) + ')';
        dotEl.style.left = (p * 100).toFixed(2) + '%';
      }
    }
    updateLyric(elapsed);
  }

  async function loadLyrics(id) {
    lyrics = [];
    renderLyrics();
    try {

      var r = await fetch('/lyrics/' + id);
      if (r.ok) {
        var text = await r.text();
        lyrics = parseLRC(text);
      }
    } catch (e) {}
    renderLyrics();
  }

  var bgPrev = document.createElement('div');
  bgPrev.className = 'bg prev';
  bg.parentNode.insertBefore(bgPrev, bg);
  var bgShowing = bg;

  function setCover(id, hasCover) {
    if (!hasCover) {
      cover.classList.remove('on');
      cover.removeAttribute('src');
      bg.style.backgroundImage = 'none';
      bgPrev.style.backgroundImage = 'none';
      return;
    }
    var src = '/cover/' + id;

    var bgSrc = '/cover-blur/' + id;

    cover.onload = function () {
      cover.classList.add('on');
      var next = (bgShowing === bg) ? bgPrev : bg;
      next.style.backgroundImage = 'url("' + bgSrc + '")';
      next.style.zIndex = '0';
      bgShowing.style.zIndex = '-1';
      bgShowing.style.opacity = '0';
      next.style.opacity = '1';
      var old = bgShowing;
      bgShowing = next;
      setTimeout(function () {
        if (bgShowing === next) old.style.backgroundImage = 'none';
      }, 1300);
    };
    cover.onerror = function () {
      cover.classList.remove('on');
      bg.style.backgroundImage = 'none';
      bgPrev.style.backgroundImage = 'none';
    };
    cover.src = src;
  }

  async function poll() {
    try {

      var r = await fetch('/api/status?sid=' + encodeURIComponent(SID), { cache: 'no-store' });
      if (!r.ok) return;
      var d = await r.json();

      listenersEl.textContent = d.listeners != null ? d.listeners : 0;
      if (typeof d.notice === 'string') showNotice(d.notice);
      if (typeof d.syncCount === 'number' && d.syncCount > 0) SYNC_COUNT = d.syncCount;

      if (!d.playing || !d.track) {
        return;
      }
      var t = d.track;

      if (t.id !== currentId) {
        currentId = t.id;
        titleEl.textContent = t.title || '未知曲目';
        artistEl.textContent = t.artist || '';
        setCover(t.id, !!t.hasCover);
        loadLyrics(t.id);
        updateMediaSession(t);

        originPdt = 0;
        fragPdt = 0;
      }

      currentDuration = t.duration || 0;
      baseElapsed = d.elapsed || 0;
      baseAt = performance.now();

      if (typeof d.originPdt === 'number' && d.originPdt > 0) originPdt = d.originPdt;

      updateProgress(effectiveElapsed());
    } catch (e) {}
  }

  function effectiveElapsed() {
    var e = elapsedFromFrag();
    if (e === null) {
      if (!baseAt) return 0;
      e = baseElapsed + (performance.now() - baseAt) / 1000;
    }
    if (e < 0) e = 0;
    if (currentDuration > 0 && e > currentDuration) e = currentDuration;
    return e;
  }

  function rafLoop() {
    if (baseAt) {
      updateProgress(effectiveElapsed());
    }
    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);

  var DEBUG = /[?&]debug=1\b/.test(location.search);
  var dbgEl = null;

  function debugOverlay() {
    if (!dbgEl) {
      dbgEl = document.createElement('div');
      dbgEl.style.cssText =
        'position:fixed;right:8px;bottom:8px;z-index:9999;' +
        'font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;' +
        'background:rgba(0,0,0,.72);color:#8ef;padding:6px 9px;' +
        'border-radius:6px;white-space:pre;pointer-events:none';
      document.body.appendChild(dbgEl);
    }
    return dbgEl;
  }

  function debugTick() {
    var cur = audioEl ? audioEl.currentTime : null;
    var srv = baseElapsed + (baseAt ? (performance.now() - baseAt) / 1000 : 0);
    var pdtAvail = !!(originPdt && fragPdt && audioEl && isFinite(cur));
    var pdt = pdtAvail
      ? (fragPdt + (cur - fragStart) * 1000 - originPdt) / 1000
      : null;
    var lag = pdtAvail ? Date.now() - (fragPdt + (cur - fragStart) * 1000) : null;

    debugOverlay().textContent =
      'srv  ' + srv.toFixed(2) + ' s\n' +
      'pdt  ' + (pdt === null ? '(无)' : pdt.toFixed(2) + ' s') + '\n' +
      'diff ' + (pdt === null ? '-' : (pdt - srv).toFixed(2) + ' s') + '\n' +
      'lag  ' + (lag === null ? '-' : Math.round(lag) + ' ms') + '\n' +
      'used ' + effectiveElapsed().toFixed(2) + ' s';

    var q = '/api/debug/report?tid=' + encodeURIComponent(currentId || '') +
      '&org=' + Math.round(originPdt || 0) +
      '&pdt=' + Math.round(fragPdt || 0) +
      '&st=' + (fragStart || 0).toFixed(3) +
      '&cur=' + (isFinite(cur) ? cur.toFixed(3) : '') +
      '&se=' + srv.toFixed(3) +
      '&pe=' + (pdt === null ? '' : pdt.toFixed(3)) +
      '&sh=' + effectiveElapsed().toFixed(3) +
      '&lag=' + (lag === null ? '' : Math.round(lag)) +
      '&rs=' + (audioEl ? audioEl.readyState : -1);
    fetch(q, { cache: 'no-store' }).catch(function () {});
  }

  if (DEBUG) setInterval(debugTick, 2000);

  window.addEventListener('resize', function () {
    if (lyrics.length) cacheLyricOffsets();
    activeLine = -2;
  });

  function tickClock() {
    var d = new Date();
    clockEl.textContent =
      (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' +
      (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }
  setInterval(tickClock, 1000);
  tickClock();

  function startPlayback() {
    var audio = new Audio();
    audio.crossOrigin = 'anonymous';
    audio.preload = 'auto';
    audioEl = audio;
    setupMediaSession();

    var url = '/stream/stream.m3u8';

    if (window.Hls && window.Hls.isSupported()) {

      var lsdc = (typeof SYNC_COUNT === 'number' && SYNC_COUNT > 0) ? SYNC_COUNT : 2;
      hlsInstance = new window.Hls({
        liveDurationInfinity: true,
        liveSyncDurationCount: lsdc,
        liveMaxLatencyDurationCount: lsdc + 6,
        maxLiveSyncPlaybackRate: 1.5,
        manifestLoadingMaxRetry: 30,
        manifestLoadingRetryDelay: 1500,
        levelLoadingMaxRetry: 30,
        fragLoadingMaxRetry: 30,
      });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(audio);
      hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, function () {
        audio.play().catch(function () {});
      });

      hlsInstance.on(window.Hls.Events.FRAG_CHANGED, function (evt, data) {
        onFragChanged(data && data.frag);
      });
      hlsInstance.on(window.Hls.Events.ERROR, function (evt, data) {
        if (!data || !data.fatal) return;
        if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
          hlsInstance.startLoad();
        } else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
          hlsInstance.recoverMediaError();
        } else {
          hlsInstance.destroy();
          hlsInstance = null;
          setTimeout(startPlayback, 3000);
        }
      });
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {

      audio.src = url;
      audio.play().catch(function () {});
      audio.addEventListener('error', function () {
        setTimeout(function () {
          audio.src = url + '?t=' + Date.now();
          audio.play().catch(function () {});
        }, 3000);
      });
    }
  }

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    var ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', function () {
        if (audioEl) audioEl.play().catch(function () {});
      });
      ms.setActionHandler('pause', function () {
        if (audioEl) audioEl.pause();
      });
      ms.setActionHandler('stop', function () {
        if (audioEl) audioEl.pause();
      });

      ['previoustrack', 'nexttrack', 'seekbackward', 'seekforward', 'seekto'].forEach(function (a) {
        try { ms.setActionHandler(a, null); } catch (e) {}
      });
    } catch (e) {}
  }

  function updateMediaSession(t) {
    if (t) {
      document.title = (t.title || '未知曲目') +
        (t.artist ? ' - ' + t.artist : '') + ' · Kokona-Radio';
    }
    if (!('mediaSession' in navigator) || !window.MediaMetadata || !t) return;
    try {
      navigator.mediaSession.metadata = new window.MediaMetadata({
        title: t.title || '未知曲目',
        artist: t.artist || '',
        album: t.album || '',
        artwork: t.hasCover ? [{
          src: location.origin + '/cover/' + t.id,
          sizes: '512x512',
          type: 'image/jpeg',
        }] : [],
      });
      navigator.mediaSession.playbackState = 'playing';
    } catch (e) {}
  }

  var enterReady = false;
  function enableEnter() {
    if (enterReady) return;
    enterReady = true;
    enterBtn.textContent = '进入电台';
    enterBtn.disabled = false;
  }
  window.addEventListener('load', enableEnter);
  setTimeout(enableEnter, 6000);

  fetch('/api/status', { cache: 'no-store' }).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (d) {
    if (d && typeof d.notice === 'string') showNotice(d.notice);
  }).catch(function () {});

  enterBtn.addEventListener('click', function () {
    if (started || enterBtn.disabled) return;
    started = true;
    gate.classList.add('gone');
    startPlayback();
    poll();
    setInterval(poll, 2000);
  });

})();
</script>
</body>
</html>
